<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A1428" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <meta name="description" content="Suinami — a wave of shorts. Videos on Walrus, social graph on Sui, every call through Tatum." />

    <!-- Fonts: Bricolage Grotesque (display), JetBrains Mono (counts/handles). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <title>suinami</title>

    <style>
      /* Pre-React splash so there is never a white flash on a dark video app. */
      html, body, #root { height: 100%; margin: 0; background: #0a1428; }
      #boot-splash {
        position: fixed; inset: 0; display: grid; place-items: center;
        background:
          radial-gradient(120% 80% at 50% 110%, #0e2a47 0%, #0a1428 60%);
        z-index: 9999; transition: opacity .4s ease;
      }
      #boot-splash .mark {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 700; letter-spacing: -0.02em; font-size: 2rem;
        color: #eaf6ff; display: flex; align-items: center; gap: .5rem;
      }
      #boot-splash .wave {
        width: 28px; height: 28px; color: #4da2ff;
        animation: bob 1.6s ease-in-out infinite;
      }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .wave { animation: none } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="mark">
        <svg class="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3" />
          <path d="M2 17c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3" opacity="0.5" />
        </svg>
        suinami
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
